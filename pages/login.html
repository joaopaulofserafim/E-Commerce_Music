<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <title>Login | Music Store</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div id="alerta-msg" class="alerta-popup"></div>

    <header class="header">
        <div class="container">
            <h1 class="logo"><a href="../index.html">Music</a></h1>
            <nav class="nav">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="produtos.html">Instrumentos</a></li>
                    <li><a href="carrinho.html">Carrinho</a></li>
                    <li><a href="login.html" class="active" id="btn-auth">Entrar</a></li>
                    <li><a href="admin.html" class="admin-icone" title="Área Administrativa" id="btn-admin">⚙</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="form-container">
        <div class="login-card">
            <h2>Entrar na Conta</h2>
            <p style="text-align: center; color: var(--color-text-muted); margin-bottom: 20px; font-size: 0.9rem;">
                Acesse sua conta para continuar comprando
            </p>

            <form id="form-login" onsubmit="login(event)">
                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="seuemail@exemplo.com" 
                    required 
                />

                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    placeholder="Digite sua senha" 
                    required 
                />

                <button type="submit" class="btn-destaque">Entrar</button>
            </form>

            <p class="link-secundario">
                Não tem conta? <a href="cadastro.html">Cadastre-se</a>
            </p>

            <p class="esqueceu">
                <a href="#" onclick="recuperarSenha(); return false;">Esqueceu a senha?</a>
            </p>


        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2025 Music Store. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
