<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Music</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <h1 class="logo"><a href="../index.html">Music</a></h1>
      </div>
    </header>

    <main class="container form-container">
      <h2>Criar Conta</h2>
      <form id="form-cadastro" onsubmit="cadastro(event)">
        <label for="cadastroNome">Nome completo</label>
        <input type="text" id="cadastroNome" required />

        <label for="cadastroEmail">E-mail</label>
        <input type="email" id="cadastroEmail" required />

        <label for="cadastroSenha">Senha</label>
        <input type="password" id="cadastroSenha" required />

        <button type="submit" class="btn-destaque">Cadastrar</button>
      </form>

      <p class="link-voltar">
        Já possui conta? <a href="login.html">Entrar</a>
      </p>
    </main>

    <footer class="footer">
      <div class="container">
        <p>© 2025 Moretto Music Store. Todos os direitos reservados.</p>
      </div>
    </footer>
    <div id="alerta-msg" class="alerta-popup"></div>
    <script src="../js/script.js"></script>
  </body>
</html>
