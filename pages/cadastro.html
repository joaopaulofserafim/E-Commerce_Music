<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
    <title>Cadastro | Music Store</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div id="alerta-msg" class="alerta-popup"></div>

    <header class="header">
        <div class="container">
            <h1 class="logo"><a href="../index.html">Music</a></h1>
            <nav class="nav">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="produtos.html">Instrumentos</a></li>
                    <li><a href="carrinho.html">Carrinho</a></li>
                    <li><a href="login.html" id="btn-auth">Entrar</a></li>
                    <li><a href="admin.html" class="admin-icone" title="Área Administrativa" id="btn-admin">⚙</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="form-container">
        <div class="login-card">
            <h2>Criar Conta</h2>
            <p style="text-align: center; color: var(--color-text-muted); margin-bottom: 20px; font-size: 0.9rem;">
                Preencha os dados abaixo para criar sua conta
            </p>

            <form id="form-cadastro" onsubmit="cadastro(event)">
                <label for="cadastroNome">Nome completo</label>
                <input 
                    type="text" 
                    id="cadastroNome" 
                    placeholder="Digite seu nome completo"
                    required 
                />

                <label for="cadastroEmail">E-mail</label>
                <input 
                    type="email" 
                    id="cadastroEmail" 
                    placeholder="seuemail@exemplo.com"
                    required 
                />

                <label for="cadastroSenha">Senha</label>
                <input 
                    type="password" 
                    id="cadastroSenha" 
                    placeholder="Mínimo 6 caracteres"
                    required 
                />

                <button type="submit" class="btn-destaque">Cadastrar</button>
            </form>

            <p class="link-secundario">
                Já possui conta? <a href="login.html">Entrar</a>
            </p>

        </div>
    </main>

    <footer class="footer">
        <div class="container">
             <p>© 2025 Music Store. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
