<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="../img/favicon.ico">
  <title>Instrumentos | Music Store</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body>
  <div id="alerta-msg" class="alerta-popup"></div>

  <header class="header">
    <div class="container">
      <h1 class="logo"><a href="../index.html">Music</a></h1>
      <nav class="nav">
        <ul>
          <li><a href="../index.html">Início</a></li>
          <li><a href="produtos.html" class="active">Instrumentos</a></li>

      </nav>
    </div>

  <main class="container catalogo">
    <section id="catalogo-produtos">
      <h2>Catálogo de Instrumentos</h2>

      <div class="filtros">
        <input type="text" id="busca" placeholder="Buscar instrumento..." />

          <option value="">Todas as categorias</option>
          <option value="Cordas">Cordas</option>

          <option value="Voz">Voz</option>
          <option value="Acessórios">Acessórios</option>
        </select>
      </div>

      <div class="produtos-grid" id="lista-produtos"></div>
    </section>

  <footer class="footer">
    <div class="container">
       <p>© 2025 Music Store. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="../js/script.js"></script>
