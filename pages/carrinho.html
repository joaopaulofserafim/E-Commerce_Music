<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrinho | Music</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <h1 class="logo"><a href="../index.html">Music</a></h1>

        <nav class="nav">
          <ul>
            <li><a href="../index.html">Início</a></li>
            <li><a href="produtos.html">Instrumentos</a></li>
            <li><a href="carrinho.html" class="active">Carrinho</a></li>

            <li><a href="login.html">Entrar</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container carrinho-page">
      <h2>Seu Carrinho</h2>

      <div id="itens-carrinho" class="lista-carrinho">
        <!-- Conteúdo  automaticamente -->
      </div>

      <div class="resumo-compra">
        <h3>Resumo da Compra</h3>

        <p id="total-carrinho" class="total"><strong>Total: R$ 0,00</strong></p>

        <button class="btn-destaque" onclick="irParaPagamento()">
          Finalizar Compra
        </button>
      </div>
    </main>

    <script>
      function irParaPagamento() {
        const usuario = JSON.parse(localStorage.getItem("usuario"));

        if (!usuario) {
          alert("Você precisa estar logado para finalizar a compra.");
          window.location.href = "login.html";
          return;
        }

        if (
          !localStorage.getItem("carrinho") ||
          JSON.parse(localStorage.getItem("carrinho")).length === 0
        ) {
          alert("Seu carrinho está vazio.");
          return;
        }

        window.location.href = "pagamento.html";
      }
    </script>

    <footer class="footer">
      <div class="container">
        <p>© 2025 Moretto Music Store. Todos os direitos reservados.</p>
      </div>
    </footer>

    <script src="../js/script.js"></script>
    <div id="alerta-msg" class="alerta-popup"></div>
  </body>
</html>
